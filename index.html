<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKEN WORKSPACE | 통합 로그인</title><style>
:root{font-family:Inter,'Noto Sans KR',system-ui,sans-serif;color:#1d2939;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{background:white;border:1px solid #e3e8ef;border-radius:20px;box-shadow:0 18px 60px #172b4d13;padding:36px;width:min(440px,100%)}.mark{background:#172b4d;color:white;width:45px;height:45px;display:grid;place-items:center;border-radius:12px;font-size:26px;font-weight:800}.login h1{font-size:26px;margin:22px 0 6px}.muted{color:#667085;font-size:13px;line-height:1.7}label{display:block;margin:18px 0 6px;font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:12px;border:1px solid #d8dee8;border-radius:10px;background:white}button.primary{background:#1c3158;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:700}button.ghost{border:1px solid #d8dee8;border-radius:9px;background:white;padding:9px 13px}.full{width:100%;margin-top:20px}.message{font-size:13px;min-height:22px;color:#bd3846;margin-top:10px}.shell{max-width:1240px;margin:auto;padding:28px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e1e7ef;padding-bottom:22px}.top h1{margin:0;font-size:26px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tab{background:#fff;border:1px solid #dce2ea;border-radius:9px;padding:11px 16px}.tab.active{background:#1c3158;color:white}.card{background:white;border:1px solid #e3e8ef;border-radius:14px;padding:22px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tool{border:1px solid #e2e7ee;border-radius:12px;padding:18px;background:#fcfdff}.tool a{color:#1c4b9d;text-decoration:none;font-weight:700}.tool p{font-size:12px;color:#667085}.note{background:#fff9ec;border:1px solid #f4dfa9;border-radius:10px;padding:13px;color:#765719;font-size:13px;line-height:1.6}.missions{display:grid;gap:10px}.mission{border:1px solid #e2e7ee;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:start;gap:15px}.mission h3{font-size:15px;margin:0 0 7px}.mission p{font-size:13px;color:#667085;margin:4px 0}.inline{display:flex;gap:8px;flex-wrap:wrap}.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.editor .wide{grid-column:1/-1}.editor label{margin:0 0 5px}.editor button{align-self:end}.pill{font-size:11px;background:#eef2f7;border-radius:20px;padding:4px 8px}a{word-break:break-word}@media(max-width:600px){.editor{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}
</style></head><body>
<div id="loginPage" class="login-wrap"><form id="loginForm" class="login"><div class="mark">L</div><h1>LUKEN WORKSPACE</h1><p class="muted">(주)루켄 통합 업무 시스템 · 등록된 계정으로 로그인하세요.</p><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><label style="display:flex;align-items:center;gap:9px;font-weight:500"><input type="checkbox" id="rememberLogin" checked style="width:auto">로그인 상태 유지 (이 기기)</label><button id="loginBtn" class="primary full">로그인</button><p id="loginError" class="message" role="alert"></p><p class="muted">직원 계정은 관리자가 Supabase에서 생성합니다. 회원가입 기능은 제공하지 않습니다.</p></form></div>
<div id="appPage" class="shell hidden"><header class="top"><div><h1>(주)루켄 통합 대시보드</h1><div class="muted" id="userInfo"></div></div><button id="logoutBtn" class="ghost">로그아웃</button></header><div id="notice" class="note" style="margin-top:18px">현재는 통합 로그인과 미션 관리의 시험 운영 버전입니다. 기존 7개 외부 운영 도구에는 별도의 인증·권한 보호가 필요합니다. 이 포털의 로그인만으로 기존 도구가 보호되지는 않습니다.</div><nav id="tabs" class="tabs"></nav><section class="card"><h2 id="branchTitle">업무 도구</h2><div id="tools" class="cards"></div></section><section class="card"><div class="top"><h2>미션보드 <span id="missionCount" class="pill"></span></h2><button id="refreshBtn" class="ghost">새로고침</button></div><p id="missionError" class="message"></p><div id="missionEditor" class="hidden"><h3 id="editorHeading">새 미션</h3><form id="missionForm" class="editor"><input type="hidden" id="editId"><div><label for="missionBranch">사업부</label><select id="missionBranch" required></select></div><div><label for="missionStatus">상태</label><select id="missionStatus"><option value="진행중">진행중</option><option value="완료">완료</option><option value="보류">보류</option></select></div><div class="wide"><label for="missionTitle">제목</label><input id="missionTitle" maxlength="160" required></div><div class="wide"><label for="missionDescription">상세 내용</label><textarea id="missionDescription" rows="3"></textarea></div><div><label for="missionDue">마감일</label><input id="missionDue" type="date"></div><div class="inline"><button type="submit" class="primary">저장</button><button type="button" id="cancelBtn" class="ghost">취소</button></div></form></div><div style="margin:16px 0"><button id="addMissionBtn" class="primary hidden">＋ 미션 추가</button></div><div id="missions" class="missions"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const PROJECT_URL='https://ptwsmkdaaodqskxlvcel.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_hwcnT1AgSLzMXAvaeVUr6A_wNmS1M43';
const db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const names={marketing:'마케팅 사업부',commerce:'이커머스 사업부',worldking:'월드킹 계양점',hellobang:'헬로방방 부천점'};
const tools={marketing:[['마케팅플로우 홈페이지','https://marketing-flow.co.kr']],commerce:[],worldking:[['매출 대시보드','https://lhd1810-cmyk.github.io/worldking-report/'],['발주 리스트','https://lhd1810-cmyk.github.io/worldking-order/'],['예약 관리','https://lhd1810-cmyk.github.io/worldking-rsv/'],['근무현황표','https://lhd1810-cmyk.github.io/worldking-wkstaff/']],hellobang:[['매출 대시보드','https://lhd1810-cmyk.github.io/hellobang-reportv2/'],['예약 관리','https://lhd1810-cmyk.github.io/hellobang-rve/'],['근무현황표','https://lhd1810-cmyk.github.io/hellobang-hbstaff/']]};
let currentUser=null,owner=false,branches=[],roles={},active='all',missionRows=[];
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showLogin(message=''){$('appPage').classList.add('hidden');$('loginPage').classList.remove('hidden');$('loginError').textContent=message;}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error||!session){showLogin();return;}currentUser=session.user;const {data:profile,error:pe}=await db.from('profiles').select('display_name,is_owner,is_hq').eq('user_id',currentUser.id).maybeSingle();if(pe){await db.auth.signOut();showLogin('프로필 확인 실패: '+pe.message);return;}if(!profile){await db.auth.signOut();showLogin('사용자 프로필이 없습니다. 관리자에게 문의하세요.');return;}owner=profile.is_owner===true||profile.is_hq===true;const {data:membership,error:me}=await db.from('branch_members').select('branch_id,role').eq('user_id',currentUser.id);if(me){showLogin('권한 조회 실패: '+me.message);return;}roles=Object.fromEntries((membership||[]).map(x=>[x.branch_id,x.role]));const {data:branchData,error:be}=await db.from('branches').select('id,name').order('name');if(be){showLogin('사업부 조회 실패: '+be.message);return;}branches=branchData||[];if(!owner&&branches.length===0){await db.auth.signOut();showLogin('배정된 사업부가 없습니다.');return;}active=owner?'all':branches[0].id;$('loginPage').classList.add('hidden');$('appPage').classList.remove('hidden');$('userInfo').textContent=(profile.display_name||currentUser.email)+' · '+(profile.is_owner?'대표 관리자':profile.is_hq?'본부장 · 전체 관리':'소속 사업부 사용자');renderTabs();await selectBranch(active);}
function renderTabs(){$('tabs').innerHTML=[...(owner?[{id:'all',name:'전체'}]:[]),...branches].map(b=>`<button class="tab ${active===b.id?'active':''}" data-branch="${escapeHtml(b.id)}">${escapeHtml(b.name)}</button>`).join('');document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>selectBranch(b.dataset.branch));}
async function selectBranch(id){if(!owner&&id==='all')return;if(!owner&&!branches.some(b=>b.id===id))return;active=id;renderTabs();$('branchTitle').textContent=id==='all'?'전체 사업부 업무 도구':(names[id]||id)+' 업무 도구';let shown=[];if(owner){shown=(id==='all'?Object.keys(tools):[id]).flatMap(b=>(tools[b]||[]).map(([name,url])=>({name,url,branch:b})));} $('tools').innerHTML=shown.length?shown.map(t=>`<article class="tool"><a href="${escapeHtml(t.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t.name)} ↗</a><p>${escapeHtml(names[t.branch]||t.branch)} · 기존 외부 시스템</p></article>`).join(''):'<p class="muted">'+(owner?'연결된 도구가 없습니다.':'외부 운영 도구는 독립적인 보안 검증 전까지 직원에게 공개하지 않습니다.')+'</p>';$('addMissionBtn').classList.toggle('hidden',!canEdit());$('missionEditor').classList.add('hidden');await loadMissions();}
function canEdit(branch=active){return owner||roles[branch]==='manager';}
async function loadMissions(){$('missionError').textContent='';let q=db.from('missions').select('id,branch_id,title,description,status,due_date,created_at').order('created_at',{ascending:false});if(active!=='all')q=q.eq('branch_id',active);const {data,error}=await q;if(error){$('missionError').textContent='미션 조회 실패: '+error.message;return;}missionRows=data||[];$('missionCount').textContent=missionRows.length+'개';$('missions').innerHTML=missionRows.length?missionRows.map(m=>`<article class="mission"><div><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(names[m.branch_id]||m.branch_id)} · ${escapeHtml(m.status)} · 마감 ${escapeHtml(m.due_date||'미정')}</p><p>${escapeHtml(m.description||'')}</p></div>${canEdit(m.branch_id)?`<div class="inline"><button class="ghost" data-edit="${escapeHtml(m.id)}">수정</button><button class="ghost" data-delete="${escapeHtml(m.id)}">삭제</button></div>`:''}</article>`).join(''):'<p class="muted">등록된 미션이 없습니다.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMission(b.dataset.delete));}
function openEditor(id=''){const m=missionRows.find(x=>x.id===id);$('missionForm').reset();$('editId').value=id;$('editorHeading').textContent=m?'미션 수정':'새 미션';$('missionBranch').innerHTML=(owner?Object.entries(names).map(([id,name])=>({id,name})):branches.filter(b=>canEdit(b.id))).map(b=>`<option value="${escapeHtml(b.id)}">${escapeHtml(b.name)}</option>`).join('');$('missionBranch').value=m?.branch_id||(active==='all'?'marketing':active);$('missionTitle').value=m?.title||'';$('missionDescription').value=m?.description||'';$('missionStatus').value=m?.status||'진행중';$('missionDue').value=m?.due_date||'';$('missionEditor').classList.remove('hidden');$('missionTitle').focus();}
async function saveMission(e){e.preventDefault();const id=$('editId').value,branch_id=$('missionBranch').value;if(!canEdit(branch_id))return;const payload={branch_id,title:$('missionTitle').value.trim(),description:$('missionDescription').value.trim(),status:$('missionStatus').value,due_date:$('missionDue').value||null};if(!payload.title)return;const result=id?await db.from('missions').update(payload).eq('id',id):await db.from('missions').insert({...payload,created_by:currentUser.id});if(result.error){$('missionError').textContent='저장 실패: '+result.error.message;return;}$('missionEditor').classList.add('hidden');await loadMissions();}
async function deleteMission(id){const m=missionRows.find(x=>x.id===id);if(!m||!canEdit(m.branch_id)||!confirm('미션을 삭제하시겠습니까?'))return;const {error}=await db.from('missions').delete().eq('id',id);if(error)$('missionError').textContent=error.message;else await loadMissions();}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='로그인 중...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;$('password').value='';if(error){$('loginError').textContent='로그인 실패: '+error.message;return;}if(!$('rememberLogin').checked){sessionStorage.setItem('luken_temporary_login','1');localStorage.setItem('luken_temporary_login_pending','1');}else{sessionStorage.removeItem('luken_temporary_login');localStorage.removeItem('luken_temporary_login_pending');}await init();};$('logoutBtn').onclick=async()=>{await db.auth.signOut();sessionStorage.removeItem('luken_temporary_login');localStorage.removeItem('luken_temporary_login_pending');currentUser=null;showLogin();};$('refreshBtn').onclick=loadMissions;$('addMissionBtn').onclick=()=>openEditor();$('cancelBtn').onclick=()=>$('missionEditor').classList.add('hidden');$('missionForm').onsubmit=saveMission;if(sessionStorage.getItem('luken_temporary_login')!=='1'&&localStorage.getItem('luken_temporary_login_pending')==='1'){db.auth.signOut().finally(()=>{localStorage.removeItem('luken_temporary_login_pending');showLogin();});}else{init().catch(e=>showLogin('연결 오류: '+e.message));}
</script></body></html>
