<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>헬로방방 발주</title><style>body{font:15px system-ui;margin:0;background:#f5f7fb;color:#17243a}header{background:#304b85;color:white;padding:20px}main{max-width:850px;margin:auto;padding:14px}section{background:white;border-radius:12px;padding:15px;margin:12px 0}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:9px 0}.item span{flex:1}select,input,textarea,button{padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit}select{width:80px}textarea{width:95%}button{background:#304b85;color:white;cursor:pointer;margin:4px}pre{white-space:pre-wrap;word-break:break-word}.muted{color:#64748b}</style><header><b>헬로방방 부천점 · 발주 관리</b><div>월드킹과 별도 관리</div></header><main><section><label>날짜 <input type="date" id="date"></label> <label>담당자 <input id="staff"></label></section><section><button onclick="show('food')">식품 발주</button><button onclick="show('supply')">비품 발주</button><button onclick="history()">발주 기록</button></section><div id="catalog"></div><section id="bottom"><h3>발주 요약</h3><div id="summary"></div><p>특이사항</p><textarea id="memo"></textarea><h3>카카오톡 발주 메시지</h3><pre id="message"></pre><button onclick="copyMsg()">메시지 복사</button><button onclick="save()">구글 시트에 저장</button><p id="status" class="muted">구글 시트 연결 준비 중</p></section><section id="history" hidden></section></main><script>
const ITEMS={"과자류":["양파링","포카칩","콘칩","바나나킥","포스틱","자갈치","오징어집","오감자","빼빼로 오리지널","빼빼로 아몬드","프링글스","참깨스틱","계란과자","고래밥","칸쵸","초코송이","홈런볼","예감 오리지널","초코픽","킨더조이","큐티초콜릿","하리보","수박바 젤리","왕꿈틀이","마이구미","뽀로로 젤리","신쫄이 젤리 딸기","신쫄이 젤리 사과","어린이 비타민"],"식사류":["너구리","진라면 순한맛","진라면 매운맛","신라면","짜파게티","참깨라면 컵","새우탕 컵","짜파게티 컵","짜파게티 범벅","진라면 순한맛 컵","사리곰탕 컵","왕뚜껑","튀김 우동","새우 볶음밥","햄야채 볶음밥","소불고기 볶음밥","직화짜장덮밥","스팸마요덮밥","미역국밥","카레덮밥","햇반","핫도그","후랑크","휠터치","만두","구운계란","케첩","간장","뽀로로 떡볶이 크림","뽀로로 떡볶이 짜장"],"음료류":["스타벅스 카페라떼","스타벅스 바닐라 라떼","스타벅스 카라멜 라떼","스타벅스 밀크티","스타벅스 블랙","코코팜 복숭아","코코팜 요구르트","토레타","칠성 사이다","밀키스","코카콜라","펩시제로콜라","비락식혜","매일우유 초코","매일우유 딸기","상하목장 흰 우유","파워오투","파워에이드","하늘보리","오렌지 주스","캐모마일 티백","카페 시럽","뽀로로 딸기","뽀로로 밀크","뽀로로 사과","뽀로로 블루베리","뽀로로 복숭아","뽀로로 샤인머스켓","뽀로로 보리차"],"비품":["12oz 컵","12oz 뚜껑","10oz 컵","10oz 뚜껑","색빨대","검정 빨대","컵홀더","핫 음료 빨대","머신 청소 솔","머신 클리너","머신 린넨 보","물티슈","소독티슈","컬러행주","소독액","락퐁","락스","고무장갑","세탁비누","윈덱스","배수관 세제","수세미","주방 세제","아이깨끗해","스포크","젓가락","스펀지 수세미","청 수세미","거름망","정전기 청소포","위생봉투 중","위생봉투 대","검정 봉투","투명 봉투","종량제 봉투","스카치 테이프","두루마리 휴지","음식물 쓰레기 봉투","아이스티 스페츌러","박스테이프","남/여 양말","종이컵","세모금 생수컵","점보롤","핸드타월","미니쿠퍼 손잡이","벤츠 전동카 손잡이","겔테이프","분무기"]};
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwcRQBOWjdsGuXp1d824FTirlr9F_Gru5xdoDK9yT4ADwz8TY3TP9nCH_uiuUXiCbguMg/exec';
let mode='food';let quantities={};const el=id=>document.getElementById(id);
el('date').value=new Date().toLocaleDateString('sv-SE');
function show(m){mode=m;el('history').hidden=true;el('bottom').hidden=false;render()}
function rows(){return mode==='food'?['과자류','식사류','음료류']:['비품']}
function picked(){return Object.entries(quantities).filter(([k,v])=>v.qty>0&&rows().includes(k.split('|')[0])).map(([k,v])=>({name:k.split('|')[1],category:k.split('|')[0],qty:v.qty,unit:v.unit}))}
function render(){el('catalog').hidden=false;el('catalog').innerHTML=rows().map(cat=>'<section><h3>'+cat+'</h3>'+ITEMS[cat].map(name=>{const key=cat+'|'+name;const q=quantities[key]||{qty:0,unit:'개'};return '<div class="item"><span>'+name+'</span><select data-key="'+key+'" data-field="qty">'+Array.from({length:31},(_,i)=>'<option '+(q.qty===i?'selected':'')+'>'+i+'</option>').join('')+'</select><select data-key="'+key+'" data-field="unit">'+['개','박스','봉','봉지','통','팩','세트'].map(u=>'<option '+(q.unit===u?'selected':'')+'>'+u+'</option>').join('')+'</select></div>'}).join('')+'</section>').join('');document.querySelectorAll('[data-key]').forEach(x=>x.onchange=()=>{quantities[x.dataset.key]??={qty:0,unit:'개'};quantities[x.dataset.key][x.dataset.field]=x.dataset.field==='qty'?Number(x.value):x.value;update()});update()}
function msg(){return '[헬로방방 부천점 '+(mode==='food'?'식품':'비품')+' 발주]\n날짜: '+el('date').value+'\n담당자: '+el('staff').value+'\n'+picked().map(x=>x.name+' '+x.qty+x.unit).join('\n')+'\n특이사항: '+el('memo').value}
function update(){el('summary').textContent=picked().map(x=>x.name+' '+x.qty+x.unit).join(' / ')||'선택한 품목 없음';el('message').textContent=msg()}
['date','staff','memo'].forEach(id=>el(id).oninput=update);
async function copyMsg(){await navigator.clipboard.writeText(msg());alert('복사했습니다')}
async function save(){if(!picked().length||!el('staff').value.trim()){alert('품목과 담당자를 입력하세요');return}if(!SCRIPT_URL){alert('구글 시트 저장 연결 전입니다.');return}const order={date:el('date').value,staff:el('staff').value,category:mode==='food'?'식품':'비품',store:'헬로방방 부천점',items:picked(),memo:el('memo').value};await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({type:'save_order',order})});el('status').textContent='저장 요청 전송 · 실제 저장은 발주 기록에서 확인하세요'}
async function history(){el('catalog').hidden=true;el('bottom').hidden=true;el('history').hidden=false;if(!SCRIPT_URL){el('history').textContent='전용 구글 시트 연결 전입니다.';return}try{const r=await fetch(SCRIPT_URL);const j=await r.json();el('history').textContent=JSON.stringify(j.records||[])}catch(e){el('history').textContent='기록 조회 실패: '+e.message}}
render();
</script></html>
